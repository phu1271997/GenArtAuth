name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-tests:
    name: Contract test suite (genlayer-test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install genlayer-test
        run: |
          python -m pip install --upgrade pip
          pip install genlayer-test

      - name: Run pytest
        run: python -m pytest tests/ -v

  frontend-build:
    name: Frontend build (Next 15 + Turbopack)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GENLAYER_CONTRACT_ADDRESS: "0x5e85C3319FA74948d753168a38d6b510C3E4FC9e"
